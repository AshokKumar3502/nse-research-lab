# Builds the NSE Lab Android app and attaches nse-lab.apk to the "android-app" release.
# Signing: with the NSE_KEYSTORE_B64 / NSE_KEY_PASSWORD secrets every build is signed with the same key, so
# new versions install over old ones; without them each build uses its own key (uninstall before updating).
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key from the repository secrets (if set)
        env:
          NSE_KEYSTORE_B64: ${{ secrets.NSE_KEYSTORE_B64 }}
        run: |
          if [ -n "$NSE_KEYSTORE_B64" ]; then echo "$NSE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nse.p12"; echo "Using the fixed signing key"; else echo "No signing secrets: using the build's own key"; fi

      - name: Build the APK
        working-directory: android
        env:
          NSE_KEYSTORE: ${{ runner.temp }}/nse.p12
          NSE_KEY_PASSWORD: ${{ secrets.NSE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Put the APK on the android-app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nse-lab.apk
          gh release view android-app >/dev/null 2>&1 || gh release create android-app \
            --title "NSE Lab - Android app" \
            --notes "NSE Lab on your phone: today's swing and intraday picks, paper-trade P&L per stock per day, history and stats, with notifications when new picks are out. Download nse-lab.apk below and open it on your phone (allow installing from this source when asked). Paper research only; not investment advice."
          gh release upload android-app nse-lab.apk --clobber
