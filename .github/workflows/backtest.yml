# Weekly: add the week's new days to the six backtest files (Backtest and Compare tabs), then publish the app.
# Saturday 05:30 UTC = 11:00 IST; can also be started by hand.
name: Backtest refresh

on:
  schedule:
    - cron: "30 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NSEWH_DATA: ${{ github.workspace }}/cloud-data
      NSEWH_SOURCE: ${{ github.workspace }}/cloud-data/src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the slim warehouse
        uses: actions/cache/restore@v4
        with:
          path: cloud-data
          key: wh-${{ github.run_id }}
          restore-keys: wh-
      - name: Extend the six backtests with the new days
        run: |
          python -c "from cloud.__main__ import prepare; prepare()"
          python -m optionlab.replay --extend --index all
          python -m cloud site
      - name: Commit the backtest files and the site
        run: |
          git config user.name "nse-research-lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Backtest refresh: $(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
