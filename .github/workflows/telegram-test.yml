# Manual only: sends one "Connected" message to TELEGRAM_CHAT_ID, to check the bot token and chat id secrets.
name: Telegram test

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Send the five sample alert cards"
        type: boolean
        default: false
      watchlist:
        description: "Send the next session's watchlist card (every instrument)"
        type: boolean
        default: false
      targets:
        description: "Send sample T1/T2/T3 target cards"
        type: boolean
        default: false
      board:
        description: "Send today's live board (all instruments, one card)"
        type: boolean
        default: false
      priority:
        description: "Send sample PRIORITY cards (range, BE READY, entry, live board)"
        type: boolean
        default: false
      instant:
        description: "Send sample instant alerts (GET READY + entry)"
        type: boolean
        default: false
      reel:
        description: "Send the last trading day's reel (preview: all six)"
        type: boolean
        default: false
      reel_store:
        description: "Store the last trading day's reel in the app only (no Telegram post)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      NSEWH_DATA: ${{ github.workspace }}/cloud-data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg (for the daily reel)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python -m optionlab.telegram_alerts ${{ inputs.reel_store && '--reel --no-send' || inputs.reel && '--reel --preview' || inputs.priority && '--sample-priority' || inputs.instant && '--sample-instant' || inputs.board && '--board --preview' || inputs.targets && '--sample-targets' || (inputs.watchlist && '--watchlist' || (inputs.sample && '--sample' || '--test')) }}
      - name: Keep a stored reel in the app list
        if: ${{ inputs.reel || inputs.reel_store }}
        run: |
          git config user.name "nse-research-lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/reels.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Reel stored"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
