# Manual only: sends one "Connected" message to TELEGRAM_CHAT_ID, to check the bot token and chat id secrets.
name: Telegram test

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Send the five sample alert cards"
        type: boolean
        default: false
      watchlist:
        description: "Send the next session's watchlist card (every instrument)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NSEWH_DATA: ${{ github.workspace }}/cloud-data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m optionlab.telegram_alerts ${{ inputs.watchlist && '--watchlist' || (inputs.sample && '--sample' || '--test') }}
